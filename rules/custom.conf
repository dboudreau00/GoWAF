# custom.conf — site-specific rules layered on top of the OWASP Core Rule Set.
#
# These load AFTER the CRS, so you can add allow-list exceptions, block extra
# patterns, or tune behavior for your app. Use rule IDs in a private range
# (150000-199999) to avoid colliding with the CRS (900000-999999).
#
# The syntax is ModSecurity SecLang, which Coraza implements. See the CRS docs
# for the anomaly-scoring model these plug into.

# --- Example 1: block a legacy admin path outright -------------------------
SecRule REQUEST_URI "@beginsWith /internal-admin" \
    "id:150001,phase:1,deny,status:403,log,msg:'Access to /internal-admin blocked'"

# --- Example 2: block requests with an empty or missing User-Agent ----------
SecRule REQUEST_HEADERS:User-Agent "@rx ^$" \
    "id:150002,phase:1,deny,status:403,log,msg:'Missing/empty User-Agent'"

# --- Example 3: allow-list a path that would otherwise trip the CRS ----------
# Uncomment and adapt if a known-good endpoint gets false-positived. This removes
# specific CRS rules just for that path.
#
# SecRule REQUEST_URI "@beginsWith /webhooks/github" \
#     "id:150010,phase:1,pass,nolog,ctl:ruleRemoveById=942100"

# --- Example 4: add a simple rate-limit-ish marker header check -------------
# Block requests claiming to be from a scanner via a tell-tale header value.
SecRule REQUEST_HEADERS:X-Scanner "@rx (?i)(sqlmap|nikto|nessus|acunetix)" \
    "id:150003,phase:1,deny,status:403,log,msg:'Known scanner signature in header'"
